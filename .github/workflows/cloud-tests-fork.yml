name: cloud tests fork

on:
  pull_request_target:
    branches:
      - main

jobs:

  bigquery:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 1. This forces the job to wait for your manual approval before running
    environment: CI-Fork-Approvals
    steps:
      # 2. Safely check out the fork's PR code
      - name: Checkout Fork Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Build with Maven
        run: mvn -pl :squashql-bigquery -am clean install --no-transfer-progress -DskipTests
      - name: Run bigquery tests
        run: mvn -pl :squashql-bigquery --no-transfer-progress -Pbigquery-test test
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.SERVICE_ACCOUNT_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          DATASET_NAME: ${{ secrets.DATASET_NAME }}

